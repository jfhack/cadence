# optional overlay: TLS and login in front of the app, for a deployment that
# starts from nothing.
#
#   cp .env.example .env          # fill in CADENCE_DOMAIN and AUTH_DOMAIN
#   scripts/init-auth.sh          # generate secrets and the first user
#   scripts/stack.sh start --caddy   # same as the -f chain below
#
# or by hand:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# already running a reverse proxy? do not use this file; see the README for
# the handful of lines to add to your existing Caddy or nginx instead.

services:
  cadence-caddy:
    container_name: cadence-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      CADENCE_DOMAIN: ${CADENCE_DOMAIN:?set CADENCE_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # named volumes by default; set these to a path in .env for directory
      # mounts instead (see the README).
      - ${CADENCE_CADDY_DATA:-caddy_data}:/data   # certificates: losing this re-issues them
      - ${CADENCE_CADDY_CONFIG:-caddy_config}:/config
    depends_on:
      - cadence-authelia
      - cadence-frontend

  cadence-authelia:
    container_name: cadence-authelia
    image: authelia/authelia:4
    restart: unless-stopped
    # not published: only Caddy talks to it, over the compose network.
    expose:
      - "9091"
    environment:
      # enables Go templating in configuration.yml, which is how the domains
      # below reach it. without this the {{ env ... }} lines stay literal.
      X_AUTHELIA_CONFIG_FILTERS: template
      CADENCE_DOMAIN: ${CADENCE_DOMAIN:?set CADENCE_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?run scripts/init-auth.sh}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?run scripts/init-auth.sh}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?run scripts/init-auth.sh}
    volumes:
      # the directory, not the two files: Authelia watches users.yml so that
      # disabling an account applies without a restart, and inotify does not
      # see writes through a single-file bind mount.
      - ./deploy/authelia:/config:ro
      - ${CADENCE_AUTHELIA_DATA:-authelia_data}:/data

  cadence-frontend:
    # Caddy reaches this over the compose network, so nothing needs to be
    # published on the host. leaving a host port open here would let anyone
    # reach the app directly and skip the login entirely.
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
  authelia_data:
