# optional overlay: Authelia only, for a host that already runs a reverse
# proxy. your proxy keeps doing TLS and routing; this just gives it something
# to ask "is this session valid?".
#
#   cp .env.example .env          # fill in CADENCE_DOMAIN and AUTH_DOMAIN
#   scripts/init-auth.sh          # generate secrets and the first user
#   scripts/stack.sh start        # same as the -f chain below
#
# or by hand:
#
#   docker compose -f docker-compose.yml -f docker-compose.authelia.yml up -d
#
# then point your proxy at it; see the README for the Caddy block. Authelia
# and the app are published on loopback only, so the proxy on this host can
# reach them and nothing else can.
#
# starting from nothing instead? use docker-compose.caddy.yml, which brings
# its own Caddy and unpublishes the app entirely.

services:
  cadence-authelia:
    container_name: cadence-authelia
    image: authelia/authelia:4
    restart: unless-stopped
    ports:
      # loopback: reachable by a proxy on this host, not from the network.
      - "127.0.0.1:${AUTHELIA_PORT:-9091}:9091"
    environment:
      # enables Go templating in configuration.yml, which is how the domains
      # below reach it. without this the {{ env ... }} lines stay literal.
      X_AUTHELIA_CONFIG_FILTERS: template
      CADENCE_DOMAIN: ${CADENCE_DOMAIN:?set CADENCE_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?run scripts/init-auth.sh}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?run scripts/init-auth.sh}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?run scripts/init-auth.sh}
    volumes:
      - ./deploy/authelia:/config:ro
      # named volume by default; set CADENCE_AUTHELIA_DATA to a path for a
      # directory mount instead.
      - ${CADENCE_AUTHELIA_DATA:-authelia_data}:/data

volumes:
  authelia_data:
