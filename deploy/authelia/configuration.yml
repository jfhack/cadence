---
# Authelia for a small, personal deployment: a handful of users in a file,
# SQLite on disk, no SMTP server to run.
#
# secrets are NOT in this file. they come from the environment
# (AUTHELIA_SESSION_SECRET, AUTHELIA_STORAGE_ENCRYPTION_KEY,
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET), which
# scripts/init-auth.sh generates into .env for you.

theme: light

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

totp:
  issuer: 'Cadence'

authentication_backend:
  password_reset:
    # no SMTP in this setup, so self-service reset is off. change a password
    # by regenerating its hash: see scripts/init-auth.sh.
    disable: true
  file:
    path: '/config/users.yml'
    # pick up edits to users.yml without a restart, so disabling a compromised
    # account takes effect right away. this needs /config mounted as a
    # directory: inotify does not see writes through a single-file bind mount.
    watch: true
    password:
      algorithm: 'argon2'

access_control:
  # nothing is public unless a rule below says so.
  default_policy: 'deny'
  rules:
    # a valid password is enough. to require TOTP as well, change this to
    # 'two_factor'; users then enrol an authenticator on first login.
    - domain: '{{ env "CADENCE_DOMAIN" }}'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  # scoped to the app's domain, which also covers the portal subdomain, so
  # one login covers both and nothing else on the server sees the cookie.
  cookies:
    - domain: '{{ env "CADENCE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_DOMAIN" }}'
      default_redirection_url: 'https://{{ env "CADENCE_DOMAIN" }}'
      expiration: '12 hours'
      inactivity: '2 hours'
      remember_me: '1 month'

regulation:
  # slow down password guessing: lock an account briefly after repeated
  # failures. worth having when every request downstream costs money.
  max_retries: 4
  find_time: '2 minutes'
  ban_time: '10 minutes'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  # writes notifications to a file instead of sending mail. with password
  # reset disabled this stays essentially unused, but Authelia requires a
  # notifier to be configured.
  filesystem:
    filename: '/data/notification.txt'
